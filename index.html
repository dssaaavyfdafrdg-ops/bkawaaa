<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سووپرایز بۆ تۆ 🎁</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 320px;
            width: 85%;
        }
        img {
            width: 160px;
            height: 160px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        h2 {
            color: #d81b60;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.4);
        }
        .btn:hover { background-color: #e91e63; }
        #prank { display: none; }
        .prank-box {
            background: #fff3cd;
            border: 2px dashed #ff9800;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .prank-box p {
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- شاشەی یەکەم -->
    <div class="card" id="screen1">
        <img src="https://i.giphy.com/media/ICOgUNjpvO0PC/giphy.gif" alt="پشیلەی کیوت">
        <h2>بەخێر بێیت<br>تکایە سووپرایزەکە بکەوە 💞🌹</h2>
        <button class="btn" onclick="showSurprise()">بکەوە</button>
    </div>

    <!-- شاشەی دووەم -->
    <div class="card" id="screen">
        <img src="https://i.giphy.com/media/C6JQPEUsZUzVq/giphy.gif" alt="پشیلەی پێکەنیناوی">
        <div class="prank-box">
            <p>گوو ناخۆی 🙂</p>
        </div>
    </div>

    <script>
        function showSurprise() {
            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen').style.display = 'block';
        }
    </script>

</body>
</html>
